services:
  backend:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    networks:
      - frappe_network
    restart: on-failure
    volumes:
      - ./runtime/apps/hrms:/home/frappe/frappe-bench/apps/hrms
      - ./apps/hb_attendance_app:/home/frappe/frappe-bench/apps/hb_attendance_app
      - frappe-dist:/home/frappe/frappe-bench/apps/frappe/frappe/public/dist
      - erpnext-dist:/home/frappe/frappe-bench/apps/erpnext/erpnext/public/dist
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - assets-data:/home/frappe/frappe-bench/assets
    environment:
      DB_HOST: ${MARIADB_HOST}
      DB_PORT: "${DB_PORT}"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      HBOS_FEISHU_SYNC_ENABLED: ${HBOS_FEISHU_SYNC_ENABLED:-0}
      HBOS_DELICLOUD_SYNC_ENABLED: ${HBOS_DELICLOUD_SYNC_ENABLED:-0}
      FEISHU_APP_ID: ${FEISHU_APP_ID}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET}
      HBOS_FEISHU_LEAVE_APP_TOKEN: ${HBOS_FEISHU_LEAVE_APP_TOKEN}
      HBOS_FEISHU_LEAVE_TABLE_ID: ${HBOS_FEISHU_LEAVE_TABLE_ID}
      HBOS_FEISHU_OVERTIME_APP_TOKEN: ${HBOS_FEISHU_OVERTIME_APP_TOKEN}
      HBOS_FEISHU_OVERTIME_TABLE_ID: ${HBOS_FEISHU_OVERTIME_TABLE_ID}
      HBOS_FEISHU_REST_LEAVE_APP_TOKEN: ${HBOS_FEISHU_REST_LEAVE_APP_TOKEN}
      HBOS_FEISHU_REST_LEAVE_TABLE_ID: ${HBOS_FEISHU_REST_LEAVE_TABLE_ID}
      HBOS_FEISHU_EXCEPTION_APP_TOKEN: ${HBOS_FEISHU_EXCEPTION_APP_TOKEN}
      HBOS_FEISHU_EXCEPTION_TABLE_ID: ${HBOS_FEISHU_EXCEPTION_TABLE_ID}
      DELICLOUD_APP_KEY: ${DELICLOUD_APP_KEY}
      DELICLOUD_APP_SECRET: ${DELICLOUD_APP_SECRET}
      HBOS_NOTIFY_WEBHOOK_URL: ${HBOS_NOTIFY_WEBHOOK_URL}
      HBOS_NOTIFY_DRY_RUN: ${HBOS_NOTIFY_DRY_RUN}
      HBOS_AI_ENABLED: ${HBOS_AI_ENABLED:-0}
      HBOS_AI_ALLOW_PII: ${HBOS_AI_ALLOW_PII:-0}
      HBOS_AI_BASE_URL: ${HBOS_AI_BASE_URL}
      HBOS_AI_API_KEY: ${HBOS_AI_API_KEY}
      HBOS_AI_MODEL: ${HBOS_AI_MODEL}
      HBOS_AI_TIMEOUT: ${HBOS_AI_TIMEOUT:-60}

  configurator:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    networks:
      - frappe_network
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: ${MARIADB_HOST}
      DB_PORT: "${DB_PORT}"
      REDIS_CACHE: ${REDIS_CACHE}
      REDIS_QUEUE: ${REDIS_QUEUE}
      SOCKETIO_PORT: "${SOCKETIO_PORT}"
    volumes:
      - ./runtime/apps/hrms:/home/frappe/frappe-bench/apps/hrms
      - ./apps/hb_attendance_app:/home/frappe/frappe-bench/apps/hb_attendance_app
      - frappe-dist:/home/frappe/frappe-bench/apps/frappe/frappe/public/dist
      - erpnext-dist:/home/frappe/frappe-bench/apps/erpnext/erpnext/public/dist
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  create-site:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    networks:
      - frappe_network
    restart: "no"
    depends_on:
      - db
      - redis-cache
      - redis-queue
      - configurator
    volumes:
      - ./runtime/apps/hrms:/home/frappe/frappe-bench/apps/hrms
      - ./apps/hb_attendance_app:/home/frappe/frappe-bench/apps/hb_attendance_app
      - frappe-dist:/home/frappe/frappe-bench/apps/frappe/frappe/public/dist
      - erpnext-dist:/home/frappe/frappe-bench/apps/erpnext/erpnext/public/dist
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 $$DB_HOST:$$DB_PORT;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1;
          fi;
        done;
        echo "sites/common_site_config.json found";
        bench new-site $$SITE_NAME \
          --mariadb-user-host-login-scope='%' \
          --admin-password=$$ADMIN_PASSWORD \
          --db-root-username=root \
          --db-root-password=$$DB_ROOT_PASSWORD \
          --install-app erpnext \
          --set-default;
    environment:
      SITE_NAME: ${SITE_NAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_HOST: ${MARIADB_HOST}
      DB_PORT: "${DB_PORT}"
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

  db:
    image: mariadb:11.8
    networks:
      - frappe_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    restart: on-failure
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    networks:
      - frappe_network
    depends_on:
      - websocket
    restart: on-failure
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS}
      UPSTREAM_REAL_IP_HEADER: ${UPSTREAM_REAL_IP_HEADER}
      UPSTREAM_REAL_IP_RECURSIVE: "${UPSTREAM_REAL_IP_RECURSIVE}"
      PROXY_READ_TIMEOUT: "${PROXY_READ_TIMEOUT}"
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE}
    volumes:
      - ./runtime/apps/hrms:/home/frappe/frappe-bench/apps/hrms
      - ./apps/hb_attendance_app:/home/frappe/frappe-bench/apps/hb_attendance_app
      - frappe-dist:/home/frappe/frappe-bench/apps/frappe/frappe/public/dist
      - erpnext-dist:/home/frappe/frappe-bench/apps/erpnext/erpnext/public/dist
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - assets-data:/home/frappe/frappe-bench/assets
    ports:
      - "${HTTP_PORT}:8080"

  queue-long:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    networks:
      - frappe_network
    restart: on-failure
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - ./runtime/apps/hrms:/home/frappe/frappe-bench/apps/hrms
      - ./apps/hb_attendance_app:/home/frappe/frappe-bench/apps/hb_attendance_app
      - frappe-dist:/home/frappe/frappe-bench/apps/frappe/frappe/public/dist
      - erpnext-dist:/home/frappe/frappe-bench/apps/erpnext/erpnext/public/dist
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      TZ: Asia/Shanghai
      FRAPPE_REDIS_CACHE: redis://${REDIS_CACHE}
      FRAPPE_REDIS_QUEUE: redis://${REDIS_QUEUE}
      FEISHU_APP_ID: ${FEISHU_APP_ID}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET}
      DELICLOUD_APP_KEY: ${DELICLOUD_APP_KEY}
      DELICLOUD_APP_SECRET: ${DELICLOUD_APP_SECRET}
      HBOS_NOTIFY_WEBHOOK_URL: ${HBOS_NOTIFY_WEBHOOK_URL}
      HBOS_NOTIFY_DRY_RUN: ${HBOS_NOTIFY_DRY_RUN}
      # AI 配置：Frappe 把 scheduled method enqueue 到 RQ worker 执行，
      # 故 scheduler 与两个 queue 都必须有；否则定时解析会静默走
      # 「未配置 AI」分支，表现为任务 0.x 秒「成功」但一条都没解析。
      HBOS_AI_BASE_URL: ${HBOS_AI_BASE_URL}
      HBOS_AI_API_KEY: ${HBOS_AI_API_KEY}
      HBOS_AI_MODEL: ${HBOS_AI_MODEL}

  queue-short:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    networks:
      - frappe_network
    restart: on-failure
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - ./runtime/apps/hrms:/home/frappe/frappe-bench/apps/hrms
      - ./apps/hb_attendance_app:/home/frappe/frappe-bench/apps/hb_attendance_app
      - frappe-dist:/home/frappe/frappe-bench/apps/frappe/frappe/public/dist
      - erpnext-dist:/home/frappe/frappe-bench/apps/erpnext/erpnext/public/dist
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      TZ: Asia/Shanghai
      FRAPPE_REDIS_CACHE: redis://${REDIS_CACHE}
      FRAPPE_REDIS_QUEUE: redis://${REDIS_QUEUE}
      FEISHU_APP_ID: ${FEISHU_APP_ID}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET}
      DELICLOUD_APP_KEY: ${DELICLOUD_APP_KEY}
      DELICLOUD_APP_SECRET: ${DELICLOUD_APP_SECRET}
      HBOS_NOTIFY_WEBHOOK_URL: ${HBOS_NOTIFY_WEBHOOK_URL}
      HBOS_NOTIFY_DRY_RUN: ${HBOS_NOTIFY_DRY_RUN}
      # AI 配置：Frappe 把 scheduled method enqueue 到 RQ worker 执行，
      # 故 scheduler 与两个 queue 都必须有；否则定时解析会静默走
      # 「未配置 AI」分支，表现为任务 0.x 秒「成功」但一条都没解析。
      HBOS_AI_BASE_URL: ${HBOS_AI_BASE_URL}
      HBOS_AI_API_KEY: ${HBOS_AI_API_KEY}
      HBOS_AI_MODEL: ${HBOS_AI_MODEL}

  redis-queue:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    restart: on-failure
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    restart: on-failure

  scheduler:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    networks:
      - frappe_network
    restart: on-failure
    command:
      - bench
      - schedule
    environment:
      FEISHU_APP_ID: ${FEISHU_APP_ID}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET}
      DELICLOUD_APP_KEY: ${DELICLOUD_APP_KEY}
      DELICLOUD_APP_SECRET: ${DELICLOUD_APP_SECRET}
      HBOS_NOTIFY_WEBHOOK_URL: ${HBOS_NOTIFY_WEBHOOK_URL}
      HBOS_NOTIFY_DRY_RUN: ${HBOS_NOTIFY_DRY_RUN}
      # AI 配置：Frappe 把 scheduled method enqueue 到 RQ worker 执行，
      # 故 scheduler 与两个 queue 都必须有；否则定时解析会静默走
      # 「未配置 AI」分支，表现为任务 0.x 秒「成功」但一条都没解析。
      HBOS_AI_BASE_URL: ${HBOS_AI_BASE_URL}
      HBOS_AI_API_KEY: ${HBOS_AI_API_KEY}
      HBOS_AI_MODEL: ${HBOS_AI_MODEL}
    volumes:
      - ./runtime/apps/hrms:/home/frappe/frappe-bench/apps/hrms
      - ./apps/hb_attendance_app:/home/frappe/frappe-bench/apps/hb_attendance_app
      - frappe-dist:/home/frappe/frappe-bench/apps/frappe/frappe/public/dist
      - erpnext-dist:/home/frappe/frappe-bench/apps/erpnext/erpnext/public/dist
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  websocket:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    networks:
      - frappe_network
    restart: on-failure
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://${REDIS_CACHE}
      FRAPPE_REDIS_QUEUE: redis://${REDIS_QUEUE}
    volumes:
      - ./runtime/apps/hrms:/home/frappe/frappe-bench/apps/hrms
      - ./apps/hb_attendance_app:/home/frappe/frappe-bench/apps/hb_attendance_app
      - frappe-dist:/home/frappe/frappe-bench/apps/frappe/frappe/public/dist
      - erpnext-dist:/home/frappe/frappe-bench/apps/erpnext/erpnext/public/dist
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:
  assets-data:
  # 编译产物共享卷：apps/frappe 与 apps/erpnext 未做宿主挂载，各容器各有独立副本，
  # 因此在 A 容器 bench build 的产物 B 容器（含 nginx）看不到，且容器重建即丢失。
  # 把这两个 app 的 dist 目录挂成同一个命名卷，让「构建」与「对外提供」看到同一份文件。
  frappe-dist:
  erpnext-dist:

networks:
  frappe_network:
    driver: bridge
