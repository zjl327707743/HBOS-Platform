<text x="88" y="88" dominant-baseline="text-before-edge" font-family="PingFang SC, Heiti SC, sans-serif" font-size="12" font-weight="400" fill="#596b86">智能运营管理平台</text>
<text x="280" y="76" dominant-baseline="text-before-edge" font-family="PingFang SC, Heiti SC, sans-serif" font-size="16" font-weight="400" fill="#425675">管理中心  /  权限管理</text>
<text x="1120" y="77" dominant-baseline="text-before-edge" font-family="PingFang SC, Heiti SC, sans-serif" font-size="14" font-weight="400" fill="#425675">演示身份 · 受限管理员</text>
