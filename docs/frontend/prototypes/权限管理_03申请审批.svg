<text x="1190" y="11" dominant-baseline="text-before-edge" font-family="PingFang SC, Heiti SC, sans-serif" font-size="12" font-weight="400" fill="#425675">2026-10-08 · 待审查</text>
<rect x="16" y="48" width="1408" height="68" rx="18" fill="white" stroke="#dce5f0"/>
