<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健康元 Joincare Logo</title>
  <style>
    :root {
      --bg: #eef6f3;
      --card: #ffffff;
      --ink: #0b5c56;
      --accent: #008384;
      --accent-soft: #8dc63f;
      --shadow: 0 18px 40px rgba(6, 62, 58, 0.12);
      --font-cn: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-en: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(141, 198, 63, 0.18), transparent 32%),
        radial-gradient(circle at bottom right, rgba(0, 131, 132, 0.14), transparent 28%),
        linear-gradient(180deg, #f7fbf9 0%, var(--bg) 100%);
      padding: 24px;
      font-family: var(--font-cn);
    }

    .stage {
      width: min(100%, 720px);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(11, 92, 86, 0.08);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 40px 32px;
    }

    .logo-wrap {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 18px 22px;
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 10px 24px rgba(7, 72, 66, 0.08);
    }

    .mark {
      width: 60px;
      height: 52px;
      flex: 0 0 auto;
      overflow: visible;
    }

    .wordmark {
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1;
      transform: translateY(1px);
    }

    .wordmark-cn {
      color: var(--accent);
      font-family: var(--font-cn);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .wordmark-en {
      margin-top: 2px;
      color: var(--accent);
      font-family: var(--font-en);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.03em;
      text-transform: lowercase;
      white-space: nowrap;
    }

    .meta {
      margin-top: 18px;
      color: rgba(11, 92, 86, 0.76);
      font-size: 14px;
      line-height: 1.6;
    }

    .code {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(0, 131, 132, 0.06);
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      word-break: break-word;
    }

    @media (max-width: 560px) {
      .stage {
        padding: 24px 18px;
        border-radius: 20px;
      }

      .logo-wrap {
        width: 100%;
        justify-content: center;
        padding: 16px;
      }

      .mark {
        width: 52px;
        height: 46px;
      }

      .wordmark-cn {
        font-size: 23px;
      }

      .wordmark-en {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="logo-wrap" aria-label="健康元 Joincare 标识">
      <svg class="mark" viewBox="0 0 60 52" role="img" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <circle cx="19" cy="30" r="16.5" fill="none" stroke="#8DC63F" stroke-width="4.8"/>
        <circle cx="34.5" cy="30" r="16.5" fill="none" stroke="#008384" stroke-width="4.8"/>
        <circle cx="27.2" cy="7.8" r="4.6" fill="#008384"/>
      </svg>
      <div class="wordmark">
        <div class="wordmark-cn">健康元</div>
        <div class="wordmark-en">joincare</div>
      </div>
    </section>

    <div class="meta">
      这是将图片内容转成的单文件 HTML 版本。图形部分使用内联 SVG，文字部分使用 HTML + CSS，后续可以直接调整尺寸、颜色、留白或嵌入到其他页面里。
    </div>

    <div class="code">文件路径: docs/frontend/健康元_Joincare_Logo.html</div>
  </main>
</body>
</html>
