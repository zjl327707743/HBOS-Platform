<style>

font-size:14px}.shell{display:grid;grid-template-columns:194px minmax(0,1fr);gap:24px}.sidebar{align-self:start;position:sticky;top:20px;min-height:530px;background:#ffffffa1;border:1px solid white;border-radius:18px;padding:20px 12px;display:flex;flex-direction:column;gap:8px}.nav-label{padding:2px 14px 8px;color:var(--muted);font-size:13px}.sidebar .inactive{padding:10px 14px;color:#64758e}.sidebar .selected{padding:11px 14px;background:var(--accent-soft);color:var(--accent);border-radius:9px;font-weight:600}.sidebar footer{margin-top:auto;padding:22px 14px 0;color:var(--muted);font-size:13px}.main{min-width:0}.crumb{font-size:14px;color:var(--muted);margin:2px 0 12px}.mainnav{display:flex;gap:8px;background:#ffffffbe;border:1px solid #ffffff;border-radius:12px;padding:6px;margin-bottom:26px;flex-wrap:wrap}.mainnav button{background:transparent;border:0;padding:9px 18px;color:#53637a}.mainnav button.active{background:var(--accent-soft);color:var(--accent);font-weight:650}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}.heading p{color:var(--muted);margin-bottom:0}.panel{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:24px;min-width:0}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}.toolbar input{flex:1;min-width:170px}.toolbar select{width:210px}input,select{padding:9px 12px;border:1px solid #dfe4ee;border-radius:8px;background:white;min-height:42px;color:var(--text)}input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:18px;height:18px;min-height:18px;vertical-align:middle}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;table-layout:fixed}th{background:#f7f8fc;font-size:14px;color:#5b6a80;font-weight:600}th,td{padding:16px 12px;border-bottom:1px solid var(--border);vertical-align:middle;overflow-wrap:anywhere}td{font-size:16px}tbody tr:last-child td{border-bottom:0}.who{display:flex;gap:12px;align-items:center}.who .avatar{border-radius:12px;flex-shrink:0}.who strong{font-size:16px}.who small{display:block;font-size:14px;color:var(--muted)}.badge{display:inline-block;background:#f0edff;color:#6255d4;border-radius:6px;padding:2px 9px;font-size:13px;white-space:normal}.badge.dim{background:#f1f3f6;color:#66758d}.badge.warning{background:#fff3df;color:#8f6216}.tagline{margin-top:20px;border-top:1px solid var(--border);padding-top:14px;font-size:14px;color:var(--muted)}.app-select{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}.app-select select{width:175px}.split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px}.side-list{padding:16px;max-height:560px;overflow:auto;align-self:start}.side-list h3{padding:4px 8px 12px}.side-list button{display:block;width:100%;text-align:left;border:0;background:transparent;margin:4px 0;padding:12px}.side-list button.active{background:var(--accent-soft);color:var(--accent)}.side-list button strong{font-size:16px;display:block}.side-list button small{display:block;font-size:13px;color:var(--muted);margin-top:4px}.editor-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--border)}.editor-head p{margin:6px 0 0}.section-label{font-size:14px;color:var(--muted);margin:18px 0 8px}.check-row{display:flex;gap:14px;align-items:flex-start;padding:11px 8px;border-bottom:1px solid #edf0f6}.check-row input{margin-top:4px;flex-shrink:0}.check-row span{font-size:16px}.check-row small{display:block;font-size:14px;color:var(--muted);margin-top:3px}.check-row.disabled{opacity:.5}.buttonbar{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding-top:20px}.inline-note{padding:14px 16px;background:#f7f8fc;border-radius:9px;font-size:14px;color:#5c6a80;margin-top:18px}.section-tabs{display:flex;gap:24px;border-bottom:1px solid var(--border);margin:18px 0 22px}.section-tabs button{border:0;border-radius:0;color:var(--muted);background:transparent;padding:10px 0}.section-tabs button.active{border-bottom:2px solid var(--accent);color:var(--accent);font-weight:600}.empty{padding:50px 24px;text-align:center}.empty h2{margin-bottom:12px}.demo-note{font-size:13px;color:var(--muted);margin:18px 0 0}.dept-item{padding:22px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px}.dept-item:last-of-type{border-bottom:0}.dept-item p{margin:6px 0 0;color:var(--muted);font-size:14px}.dept-item strong{display:block}.small-link{color:var(--accent);font-size:14px}.overlay{position:fixed;inset:0;background:#17213960;z-index:90;display:flex;justify-content:flex-end}.drawer{width:min(660px,100vw);height:100%;background:white;display:flex;flex-direction:column;box-shadow:-12px 0 50px #1d294829}.drawer>header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px 26px;border-bottom:1px solid var(--border)}.drawer-body{padding:24px 26px;overflow-y:auto;flex:1;min-height:0}.drawer>footer{padding:18px 26px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:12px;background:white}.person-brief{padding:16px 18px;background:#f6f7fc;border-radius:10px;margin-bottom:24px}.person-brief p{margin:3px 0 0;font-size:14px;color:var(--muted)}.form-label{display:block;font-weight:600;margin:20px 0 8px}.full{width:100%}.choice{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:9px}.preview-box{padding:20px;background:#f5f3ff;border:1px solid #e5e0ff;border-radius:12px;margin-top:24px}.preview-box h3{font-size:16px;color:#584aca;margin-bottom:8px}.preview-box p{margin-bottom:0}.preview-box ul{padding-left:22px;margin:6px 0}.help{font-size:14px;color:var(--muted);margin-top:8px}.error{padding:12px;background:#fff1f1;color:#a5293c;border-radius:8px;margin:15px 0}.row-actions{display:flex;align-items:center;gap:4px;white-space:nowrap}.hidden{display:none!important}.review-list{padding-left:20px;margin:8px 0 20px}.review-list li{margin:7px 0}.audit-entry{padding:14px 0;border-bottom:1px solid var(--border)}.audit-entry small{font-size:14px;color:var(--muted)}#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:120;background:white;box-shadow:0 8px 28px #24345224;border:1px solid var(--border);padding:12px 20px;border-radius:10px;max-width:90vw}.extra{border-top:1px solid var(--border);padding-top:16px;margin-top:24px}button.reset{font-size:14px;min-height:36px;padding:6px 12px}
@media(max-width:1120px){.frame{padding:18px}.shell{grid-template-columns:170px minmax(0,1fr);gap:18px}.split{grid-template-columns:190px minmax(0,1fr)}.panel{padding:18px}.mainnav button{padding:8px 12px}.table-wrap table{min-width:660px}}
@media(max-width:780px){.shell{display:block}.sidebar{display:none}.topbar{padding:12px 16px}.account .muted{display:none}.frame{padding:12px}.split{grid-template-columns:1fr}.side-list{display:flex;gap:6px;overflow-x:auto;max-height:none}.side-list h3{display:none}.side-list button{min-width:160px;margin:0}.heading{flex-wrap:wrap}.mainnav{gap:3px}.mainnav button{font-size:14px;padding:8px 10px}.banner{padding:8px 12px;text-align:left}.banner strong{display:block}.drawer-body{padding:20px}.drawer>header,.drawer>footer{padding:16px 20px}.app-select{width:100%;justify-content:flex-start}.heading h1{font-size:26px}}

<body>
<div class="banner"><strong>交互设计 · 等待确认</strong>全部是模拟数据。保存只影响本页，未连接 HBOS 后端；角色先存演示草稿，再确认发布。刷新可恢复初始状态。</div>
<div class="frame">
<header class="topbar"><div class="brand"><div class="mark">H</div><div><strong>HBOS</strong><small>海滨智能运营工作台</small></div></div><div class="account"><div class="muted">人事管理员 · 设计身份</div><div class="avatar">人事</div><button class="reset" id="reset">重置演示</button></div></header>
<div class="shell"><aside class="sidebar"><div class="nav-label">工作台</div><div class="inactive">⌂　首页</div><div class="inactive">≡　我的工作</div><div class="inactive">▦　应用中心</div><div class="selected">♙　管理中心</div><footer>本页仅演示管理中心的三处交互，不包含真实登录或考勤记录。</footer></aside>
<main class="main"><div class="crumb">管理中心</div><nav class="mainnav" aria-label="管理中心页面"><button data-page="people" class="active">员工管理</button><button data-page="departments">部门管理</button><button data-page="roles">角色与权限</button><button data-page="audit">变更记录</button></nav><div id="content"></div><p class="demo-note">设计范围：人员选角色、角色改权限、部门设默认。功能勾选为设计演示；管理员完整功能接入清单见工程附件，当前均未由角色授权。</p></main></div>
</div>
<div id="overlay" class="overlay hidden"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header><h2 id="dialog-title"></h2><button id="close" aria-label="关闭">✕</button></header><div id="dialog-body" class="drawer-body"></div><footer id="dialog-footer"></footer></section></div>
<div id="toast" role="status" class="hidden"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=x=>JSON.parse(JSON.stringify(x));
const departments=[{id:'d1',name:'演示一车间'},{id:'d2',name:'演示质量部'},{id:'d3',name:'演示人事部'}];
const functions=[
 {id:'self',name:'查看自己的考勤',group:'员工自助',detail:'查看本人打卡和每日考勤结果。',kind:'self'},
 {id:'board',name:'查看部门考勤面板',group:'部门工作',detail:'查看负责部门的考勤概览。',kind:'department'},
 {id:'records',name:'查看部门员工考勤',group:'部门工作',detail:'查询负责部门的员工打卡和考勤记录。',kind:'department'},
 {id:'company',name:'查看全公司考勤',group:'公司管理',detail:'查看所负责公司的考勤汇总和明细。',kind:'company'},
 {id:'schedule',name:'管理班次与排班',group:'公司管理',detail:'在授权范围内维护班次及排班。',kind:'company'},
 {id:'correction',name:'办理考勤更正',group:'公司管理',detail:'仍按业务要求保留原因、审核和记录。',kind:'company'},
 {id:'import',name:'导入打卡与排班数据',group:'公司管理',detail:'按导入预览、校验、受控提交流程执行；仍须接入范围校验。',kind:'company'},
 {id:'rules',name:'配置考勤规则与重新计算',group:'公司管理',detail:'保留原生规则、审计与重算确认，不开放真实任务。',kind:'company'},
 {id:'reports',name:'查看考勤报表',group:'报表与导出',detail:'按该角色负责的部门或公司范围查看。',kind:'shared'},
 {id:'export',name:'导出考勤数据',group:'报表与导出',detail:'仅导出已授权范围内的数据。',kind:'shared'}
];
const initial={
 roles:[
  {id:'staff',name:'普通员工',scope:'self',description:'看自己的打卡与出勤，不看同事数据。',permissions:['self'],version:1},
  {id:'clerk',name:'部门考勤员',scope:'department',description:'负责一个或多个部门的考勤查看。',permissions:['self','board','records','reports'],version:1},
  {id:'admin',name:'考勤管理员',scope:'company',description:'使用明确负责公司的完整考勤功能；具体接入差距见工程附件。',permissions:functions.map(x=>x.id),version:1}
 ],
 defaults:{d1:'staff',d2:'staff',d3:'staff'},
 people:[
 {id:'a',name:'员工甲',number:'0001',department:'d1',role:null,scopes:[],disabled:false},
 {id:'b',name:'员工乙',number:'0002',department:'d1',role:'clerk',scopes:['d2'],disabled:false},
 {id:'c',name:'人事专员',number:'0003',department:'d3',role:'admin',scopes:['company'],disabled:false},
 {id:'d',name:'员工丙',number:'0004',department:'d1',role:null,scopes:[],disabled:false}
 ],log:[]};
let data=clone(initial),page='people',app='attendance',roleId='clerk',deptId='d1',roleDraft=null,roleDrafts={},dialog=null,returnFocus=null,toastTimer=null,confirmResolve=null;
const deptName=id=>departments.find(x=>x.id===id)?.name||'部门未确认';
const roleFor=p=>p.role===null?data.defaults[p.department]:p.role;
const roleObj=id=>data.roles.find(r=>r.id===id);
const scopeText=(p,r=roleObj(roleFor(p)))=>!r?'未开通':!r.permissions.length?'暂无功能权限':r.scope==='self'?'仅本人':r.scope==='company'?'演示公司（全部部门）':p.scopes.map(deptName).join('、')||'尚未指定部门';
const allowedFunction=(r,f)=>r.scope==='company'||(r.scope==='department'&&f.kind!=='company')||(r.scope==='self'&&f.kind==='self');
function countRole(id){return data.people.filter(p=>roleFor(p)===id)}
function showToast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2400)}
function log(text){data.log.unshift({text,at:new Date().toLocaleTimeString('zh-CN',{hour12:false})})}
function appSelect(){return `<label class="app-select">应用<select id="app"><option value="attendance" ${app==='attendance'?'selected':''}>考勤管理</option><option value="lims" ${app==='lims'?'selected':''}>LIMS 质量管理</option><option value="inventory" ${app==='inventory'?'selected':''}>仓储管理</option><option value="knowledge" ${app==='knowledge'?'selected':''}>知识库</option></select></label>`}
async function navigate(next){if(roleDraft&&JSON.stringify([...roleDraft].sort())!==JSON.stringify([...(roleDrafts[roleId]||roleObj(roleId).permissions)].sort())&&!await confirmDemo('离开将放弃尚未保存的更改，继续吗？'))return;roleDraft=null;page=next;render()}
function render(){
 document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 if(page==='people')renderPeople();else if(page==='departments')renderDepartments();else if(page==='roles')renderRoles();else renderAudit();
 const sel=$('app');if(sel)sel.onchange=async()=>{const next=sel.value;if(roleDraft&&JSON.stringify([...roleDraft].sort())!==JSON.stringify([...(roleDrafts[roleId]||roleObj(roleId).permissions)].sort())&&!await confirmDemo('切换应用将放弃尚未保存的更改，继续吗？')){sel.value=app;return}app=next;roleDraft=null;render()};
}
function renderPeople(){
 $('content').innerHTML=`<div class="heading"><div><h1>员工管理</h1><p>找到员工，选择他在应用中担任的角色。</p></div>${appSelect()}</div><section class="panel">${app!=='attendance'?placeholder():`<div class="toolbar"><input id="search" placeholder="搜索姓名或工号" aria-label="搜索员工"><span class="muted">4 位模拟员工</span></div><div class="table-wrap"><table><thead><tr><th style="width:25%">员工</th><th style="width:17%">部门</th><th style="width:21%">考勤角色</th><th style="width:20%">可以查看的范围</th><th style="width:17%">操作</th></tr></thead><tbody id="people-rows"></tbody></table></div><div class="tagline">为员工单独指定角色后，不再随部门默认角色变化。修改角色，不会修改账号或历史考勤。</div>`}</section>`;
 if(app==='attendance'){renderPeopleRows('');$('search').oninput=e=>renderPeopleRows(e.target.value)}
}
function renderPeopleRows(q){$('people-rows').innerHTML=data.people.filter(p=>(p.name+p.number).includes(q)).map(p=>{const r=roleObj(roleFor(p));return `<tr><td><div class="who"><div class="avatar">${esc(p.name.slice(-1))}</div><div><strong>${esc(p.name)}</strong><small>工号 ${p.number} · 模拟</small></div></div></td><td>${deptName(p.department)}</td><td><strong>${r?r.name:'未开通'}</strong><div class="muted">${p.role===null?'部门默认':'单独指定'} ${p.disabled?'<span class="badge warning">已临时禁用</span>':p.otherBlocked?'<span class="badge warning">其他限制生效</span>':''}</div></td><td>${scopeText(p,r)}</td><td><div class="row-actions"><button class="link" data-person="${p.id}">设置角色</button><button class="link" data-more="${p.id}" aria-label="${p.name}的更多操作">⋯</button></div></td></tr>`}).join('')||'<tr><td colspan="5">没有找到员工。</td></tr>';document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>openPerson(b.dataset.person));document.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>openPause(b.dataset.more))}
function placeholder(){const label={lims:'LIMS 质量管理',inventory:'仓储管理',knowledge:'知识库'}[app];return `<div class="empty"><span class="badge dim">后续接入</span><h2 style="margin-top:15px">${label}</h2><p class="muted">接入后，沿用“员工选角色、角色设权限”的同一套管理方式。</p><p class="muted">本轮不配置该应用，也不改变其现有权限。</p><button id="back-attendance">查看考勤示例</button></div>`}
function renderRoles(){
 $('content').innerHTML=`<div class="heading"><div><h1>角色与权限</h1><p>先规定每种角色能做什么，再把角色分给员工。</p></div>${appSelect()}</div>${app!=='attendance'?`<section class="panel">${placeholder()}</section>`:`<div class="split"><aside class="panel side-list"><h3>考勤角色</h3>${data.roles.map(r=>`<button data-role="${r.id}" class="${roleId===r.id?'active':''}"><strong>${r.name}</strong><small>${countRole(r.id).length} 位员工使用</small></button>`).join('')}</aside><section class="panel" id="role-editor"></section></div>`}`;
 if(app==='attendance'){document.querySelectorAll('[data-role]').forEach(b=>b.onclick=async()=>{if(roleDraft&&JSON.stringify([...roleDraft].sort())!==JSON.stringify([...(roleDrafts[roleId]||roleObj(roleId).permissions)].sort())&&!await confirmDemo('切换角色将放弃未保存的更改，继续吗？'))return;roleId=b.dataset.role;roleDraft=null;render()});renderRoleEditor()}
}
function renderRoleEditor(){const r=roleObj(roleId),visibleFunctions=functions.filter(f=>allowedFunction(r,f));if(!roleDraft)roleDraft=[...(roleDrafts[r.id]||r.permissions)];

$('close').onclick=closeDialog;
$('overlay').onclick=e=>{if(e.target===$('overlay'))closeDialog()};
document.addEventListener('keydown',e=>{if($('overlay').classList.contains('hidden'))return;if(e.key==='Escape'){e.preventDefault();closeDialog()}if(e.key==='Tab'){const f=[...$('overlay').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),a[href]')].filter(x=>x.offsetParent!==null);if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
document.addEventListener('click',e=>{if(e.target.closest('#back-attendance')){app='attendance';render()}});
$('reset').onclick=()=>{data=clone(initial);page='people';app='attendance';roleDraft=null;roleDrafts={};closeDialog();render();showToast('演示已重置，不影响任何真实数据。')};
render();
</script>
</body></html>
