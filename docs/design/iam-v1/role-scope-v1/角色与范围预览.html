<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:; form-action 'none'; base-uri 'none'"><title>HBOS · 角色与范围设计预览</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#24324a;background:#f1f4fa;font-size:16px;line-height:1.6;--accent:#6255ef;--border:#e1e6ef}*{box-sizing:border-box}body{margin:0;background:radial-gradient(at 12% 0%,#dcd8ff,transparent 38%),radial-gradient(at 80% 30%,#def4fa,transparent 45%);min-height:100vh}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer;border:1px solid #d6dce8;border-radius:9px;background:#fff;color:#33415b;padding:9px 16px}button:hover{border-color:var(--accent);color:var(--accent)}button:disabled{cursor:default;color:#8490a2;background:#f6f7fa}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.primary:hover{color:#fff;background:#5144d8}.quiet{border:0;background:transparent;color:var(--accent)}.danger{color:#b93648}a{color:var(--accent)}.banner{position:sticky;top:0;z-index:10;background:#fff4d7;border-bottom:1px solid #ead4a3;padding:10px 28px;color:#785423;font-size:14px}.banner strong{margin-right:16px}.frame{max-width:1600px;margin:auto;padding:28px}.header{border:1px solid #fff;background:#ffffffbb;border-radius:22px;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:22px;font-weight:700;letter-spacing:.5px}.muted{color:#6c7990;font-size:14px}.shell{display:grid;grid-template-columns:216px minmax(0,1fr);gap:24px}nav{border:1px solid #fff;background:#ffffffa8;border-radius:20px;padding:20px 12px;align-self:start}nav button{display:block;width:100%;border:0;background:transparent;text-align:left;margin:6px 0;padding:12px}nav button.active{color:var(--accent);background:#edeaff;font-weight:600}main{min-width:0}.crumb{font-size:14px;color:#68778e;margin-bottom:12px}h1{font-size:28px;line-height:1.4;margin:0 0 8px}h2{font-size:20px;margin:0}h3{font-size:16px;margin:0 0 10px}p{margin:8px 0 16px}.panel{background:#ffffffdf;border:1px solid #fff;border-radius:16px;padding:24px;margin:20px 0}.head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--border);margin:20px 0}.tabs button{border:0;border-radius:0;padding:10px 4px;background:transparent}.tabs button.active{color:var(--accent);border-bottom:2px solid var(--accent);font-weight:600}table{border-collapse:collapse;table-layout:fixed;width:100%;font-size:16px}th{font-size:14px;background:#f6f8fc;color:#5a687e;text-align:left;font-weight:600}th,td{padding:16px 14px;border-bottom:1px solid var(--border);vertical-align:top;overflow-wrap:anywhere}.table-wrap{overflow-x:auto}table{min-width:690px}.tag{display:inline-block;padding:2px 9px;border-radius:6px;font-size:14px;background:#eef3fa;color:#536780;white-space:normal}.green{background:#e8f6ee;color:#21704e}.amber{background:#fff4d7;color:#8b641c}.purple{background:#eeeaff;color:#6553c0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.spacer{margin-left:auto}.note{padding:14px 16px;background:#f4f6fb;border-radius:9px;font-size:14px}.note.warn{background:#fff6e3;color:#825d22}.assignment{padding:16px;border:1px solid var(--border);border-radius:10px;margin:12px 0}.assignment header{display:flex;justify-content:space-between;gap:12px}.assignment label{display:grid;gap:6px;margin-top:12px}select,input{width:100%;padding:9px 12px;border:1px solid #d5dce8;background:#fff;border-radius:8px;color:#27364e}input[type=checkbox],input[type=radio]{width:auto}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checks{display:flex;gap:16px;flex-wrap:wrap}.drawer-bg{position:fixed;inset:0;background:#18253e55;z-index:20}.drawer{position:absolute;right:0;top:0;bottom:0;width:min(720px,95vw);background:#fff;display:flex;flex-direction:column;box-shadow:-12px 0 40px #17234022}.drawer>header{padding:22px 28px;border-bottom:1px solid var(--border)}.drawer-body{padding:24px 28px;overflow:auto;flex:1}.drawer>footer{padding:16px 28px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:12px;background:#fff}.hidden{display:none!important}details{margin:16px 0}summary{cursor:pointer;color:#516079}#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#fff;box-shadow:0 8px 28px #25355322;padding:12px 20px;border-radius:10px;z-index:30;max-width:85vw}.role-card{border:1px solid var(--border);border-radius:12px;padding:18px;margin:14px 0}.role-card p{margin-bottom:8px}code{font-size:14px;overflow-wrap:anywhere}.status{font-weight:600;color:#28694d}@media(max-width:1000px){.shell{grid-template-columns:180px minmax(0,1fr)}.frame{padding:16px}.panel{padding:18px}}@media(max-width:720px){.shell{display:block}nav{display:flex;padding:4px;margin-bottom:20px}nav button{text-align:center}.header{padding:14px}.grid2{grid-template-columns:1fr}.banner{padding:8px 16px}h1{font-size:24px}}
</style></head><body>
<div class="banner"><strong>设计预览 · 等待 Owner 确认</strong>全部为合成数据；保存仅保留在当前演示内存。未连接 5198，不写入角色或权限。</div>
<div class="frame"><header class="header"><div><span class="brand">HBOS</span><span class="muted">　海滨智能运营工作台</span></div><div class="muted">人事管理员（设计身份）</div></header><div class="shell"><nav aria-label="设计页面"><div class="muted" style="padding:4px 12px">管理中心 · 三处局部设计</div><button data-page="person" class="active">员工详情</button><button data-page="department">部门管理</button><button data-page="app">应用权限</button></nav><main id="main"></main></div></div>
<div id="toast" role="status" class="hidden"></div>
<div id="overlay" class="drawer-bg hidden"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><header class="head"><h2 id="drawer-title">设置权限（设计预览）</h2><button data-action="close" aria-label="关闭设置">关闭</button></header><div class="drawer-body" id="editor"></div><footer><button data-action="close">取消</button><button class="primary" id="next" data-action="preview">核对最终结果</button></footer></section></div>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const templates={self:{id:'attendance.employee_self',version:1,name:'员工自助',functions:'查看自己的原始打卡、每日考勤结果',scopes:['SELF'],native:'原生 Employee（身份）；现有 SELF 执行器',state:'SELF 功能已接入；角色模板待实施'},clerk:{id:'attendance.department_clerk',version:1,name:'部门考勤员',functions:'查看具名部门面板与考勤记录（映射候选）',scopes:['DEPARTMENT'],native:'不默认授予 HR Manager；逐入口接入待核定',state:'设计候选 / 待接入'},hr:{id:'attendance.company_admin',version:1,name:'人事考勤管理员',functions:'具名公司的已批准考勤动作清单；新增敏感动作另审',scopes:['COMPANY'],native:'受控映射原生 HR User/Manager 的必要子集，未授予',state:'设计候选 / 待接入'},tester:{id:'lims.analyst',version:1,name:'LIMS 检验员',functions:'检验任务办理；限受派检验组/任务',scopes:['LAB_GROUP'],native:'现有 LIMS 角色待逐项核对',state:'设计示例 / 待接入'},reviewer:{id:'lims.reviewer',version:1,name:'LIMS 复核员',functions:'复核受派组任务；不得复核本人检验结果',scopes:['LAB_GROUP'],native:'现有 LIMS 角色及资格执行器待核对',state:'设计示例 / 待接入'}};
let pauseStates={attendance:false,lims:false},limsSeeded=false;
let page='person',app='attendance',tab='users',saved=[{key:'example-clerk',role:'clerk',scope:'验收部门 A',until:'2026-12-31'}],draft=[],paused=false,draftPaused=false,defaultMode='grant',mode='person',hadDeny=false,clearDeny=false,returnFocus=null;
function roleKeys(){return app==='attendance'?['self','clerk','hr']:['tester','reviewer']}
function defaultSummary(){return defaultMode==='grant'?'来自验收部门 A 默认：员工自助 · 本人。继承项不能作为个人授予直接删除。':defaultMode==='none'?'验收部门 A 未默认授予；单独合法角色仍按自己的范围生效。':'验收部门 A 明确禁止：保留硬限制，单独角色不绕过此限制。'}
function sourceRows(){return app==='attendance'?[...(defaultMode==='grant'?[{key:'inherited',role:'self',scope:'本人',source:'验收部门 A 默认',inherited:true}]:[]),...saved.filter(g=>['self','clerk','hr'].includes(g.role)).map(g=>({...g,source:'单独授予'}))]:saved.filter(g=>['tester','reviewer'].includes(g.role)).map(g=>({...g,source:'单独授予'}))}
function tabs(items,active){return '<div class="tabs">'+items.map(([id,title])=>`<button data-tab="${id}" class="${active===id?'active':''}">${title}</button>`).join('')+'</div>'}
function rowsTable(rows){return `<div class="table-wrap"><table><thead><tr><th style="width:13%">应用</th><th style="width:17%">使用角色</th><th style="width:22%">可查看 / 办理的范围</th><th style="width:22%">来源</th><th style="width:26%">当前状态</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${app==='attendance'?'考勤':'LIMS'}</td><td>${templates[row.role].name}</td><td>${esc(row.scope)}${row.until?`<div class="muted">有效至 ${esc(row.until)}</div>`:''}</td><td>${esc(row.source)}</td><td><span class="tag ${row.role==='self'?'green':'amber'}">${paused?'模拟已暂停':app==='attendance'&&defaultMode==='deny'?'模拟受部门禁止':app==='attendance'&&hadDeny?'模拟受个人限制':row.role==='self'?(hadDeny?'模拟受个人限制':'功能已开通 · 角色设计示意'):'设计示例 / 待接入'}</span></td></tr>`).join('')||'<tr><td colspan="5">未安排角色（设计状态）</td></tr>'}</tbody></table></div>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let html='';
if(page==='person')html=`<div class="crumb">员工管理 / 员工甲 / 应用权限</div><div class="head"><div><h1>员工甲 <span class="muted">工号 0001</span></h1><p class="muted">验收部门 A · 合成档案；账号仍对应唯一 User</p></div><button data-action="reset">重置演示</button></div>${tabs([['profile','员工资料'],['account','账号与登录'],['work','应用权限']], 'work')}<section class="panel"><div class="head"><h2>${app==='attendance'?'考勤管理':'LIMS 质量检验'}</h2><div class="row"><select id="app-select" aria-label="选择演示应用"><option value="attendance" ${app==='attendance'?'selected':''}>考勤管理</option><option value="lims" ${app==='lims'?'selected':''}>LIMS 质量检验</option></select><button class="primary" data-action="edit">设置权限</button></div></div><p class="muted">每条角色与自己的范围、期限成对；不会与另一条角色的范围混用。</p>${app==='attendance'?`<p class="note ${defaultMode==='deny'?'warn':''}">${defaultSummary()}</p>`:''}${rowsTable(sourceRows())}<details><summary>查看来源与限制</summary><p>${app==='attendance'&&hadDeny?'保留示例个人拒绝：取消默认或恢复权限前必须单独核对。':'此应用没有加载个人拒绝示例。'} 应用暂停属于总限制；管理授权与业务角色分别核验。</p><button data-action="department-link">查看验收部门 A 的默认</button> ${!hadDeny&&app==='attendance'?'<button data-action="deny-example">载入个人拒绝示例</button>':''}</details>${app==='lims'?'<div class="note">按当前各条授予核对角色与范围。<button class="quiet" data-action="pair-check">核对是否可以复核 B 组</button><span id="pair-result"></span></div>':''}</section>`;
if(page==='department')html=`<div class="crumb">部门管理 / 验收部门 A</div><h1>验收部门 A</h1><p class="muted">验收公司甲 · 2 位合成成员</p>${tabs([['members','部门成员'],['defaults','默认应用权限']],tab==='members'?'members':'defaults')}<section class="panel">${tab==='members'?'<h2>部门成员</h2><p>员工甲（0001） · 员工乙（0002）</p><p class="muted">这里不展示考勤明细。</p>':`<div class="head"><h2>默认应用权限</h2><button class="primary" data-action="department-edit">修改默认</button></div><div class="table-wrap"><table><thead><tr><th>应用</th><th>默认普通角色</th><th>默认数据范围</th><th>受影响成员</th></tr></thead><tbody><tr><td>考勤</td><td>${defaultMode==='grant'?'员工自助（设计模板）':defaultMode==='none'?'未默认授予':'明确禁止（保留独立语义）'}</td><td>${defaultMode==='grant'?'每人仅查看本人的考勤':'无默认授予范围'}</td><td>2 人 · 个人合法来源和限制另算</td></tr><tr><td>LIMS</td><td>应用入口 / 基础身份（设计候选）</td><td>不含检验、复核、QA 签署资格</td><td>具名职责另行授予</td></tr></tbody></table></div><p class="note">部门默认用于普通成员的基础工作。部门考勤员、人事考勤管理员等扩大数据范围的职责，需逐人授予。</p>`}</section>`;
if(page==='app')html=`<div class="crumb">应用权限 / ${app==='attendance'?'考勤管理':'LIMS 质量检验'}</div><div class="head"><h1>${app==='attendance'?'考勤管理':'LIMS 质量检验'}</h1><select id="app-select" aria-label="选择演示应用" style="width:220px"><option value="attendance" ${app==='attendance'?'selected':''}>考勤管理</option><option value="lims" ${app==='lims'?'selected':''}>LIMS 质量检验</option></select></div>${tabs([['users','使用人员'],['templates','角色模板']],tab==='templates'?'templates':'users')}<section class="panel">${tab==='templates'?`<div class="head"><h2>角色模板</h2><span class="tag amber">版本化候选目录 · 无真实角色写入</span></div>${roleKeys().map(key=>{const r=templates[key];return `<article class="role-card"><div class="head"><h3>${r.name}</h3><span class="tag ${key==='self'?'green':'amber'}">${r.state}</span></div><p>${r.functions}</p><div class="muted">允许范围：${r.scopes.join(' / ')}<br>原生对应：${r.native}<br>模板 ID / 版本：<code>${r.id}@${r.version}</code></div><button class="quiet" data-role-detail="${key}">查看候选功能映射</button></article>`}).join('')}`:`<div class="head"><h2>使用人员</h2><button data-action="person-link">查看员工甲的权限</button></div>${rowsTable(sourceRows())}`}</section>`;
$('main').innerHTML=html;}
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),4000)}
function openEditor(kind){mode=kind;returnFocus=document.activeElement;draft=structuredClone(saved);draftPaused=paused;clearDeny=false;$('overlay').classList.remove('hidden');$('next').dataset.action='preview';$('next').textContent='核对最终结果';drawEditor();$('overlay').querySelector('button').focus()}
function drawEditor(){if(mode==='department'){$('editor').innerHTML=`<h3>验收部门 A · 考勤默认</h3><div class="assignment"><label><input type="radio" name="default" value="grant" ${defaultMode==='grant'?'checked':''}> 默认授予员工自助：每位成员仅查看本人考勤</label><label><input type="radio" name="default" value="none" ${defaultMode==='none'?'checked':''}> 不再默认授予：不影响其他独立合法角色</label><label><input type="radio" name="default" value="deny" ${defaultMode==='deny'?'checked':''}> 明确禁止：硬限制，现有 deny 保留</label></div><p class="note warn">后两种状态不同。当前显式 deny 不会自动改成“未授予”；历史兼容迁移需 Owner 确认。</p><p>范围固定为每位成员本人；此处不提供部门考勤员或人事考勤管理员。</p>`;return}
$('editor').innerHTML=`<div class="note">${app==='attendance'?defaultSummary():'部门仅提供入口/基础身份；检验与复核职责另行具名授予。'}</div><h3 style="margin-top:24px">单独授予</h3><div id="assignments">${draft.filter(g=>roleKeys().includes(g.role)).map(grant=>{const r=templates[grant.role],opts=r.scopes[0]==='SELF'?[]:r.scopes[0]==='DEPARTMENT'?['验收部门 A','验收部门 B']:r.scopes[0]==='COMPANY'?['验收公司甲','验收公司乙']:['检验组 A','检验组 B'];return `<article class="assignment"><header><strong>${r.name}</strong><button class="quiet danger" data-remove="${grant.key}">移除这条单独授予</button></header><span class="tag amber">${r.state}</span>${opts.length?`<label>这条角色的范围<select data-scope="${grant.key}" aria-label="${r.name}范围">${opts.map(v=>`<option ${grant.scope===v?'selected':''}>${v}</option>`).join('')}</select></label>`:'<p>查看自己的考勤（固定本人，无二次范围选择）</p>'}<label>有效至（留空表示无结束日期）<input type="date" data-until="${grant.key}" value="${esc(grant.until||'')}" aria-label="${r.name}有效期"></label></article>`}).join('')||'<p class="muted">暂无单独授予。</p>'}</div><div class="row"><select id="new-role" aria-label="选择要添加的角色" style="flex:1">${roleKeys().map(key=>`<option value="${key}">${templates[key].name}</option>`).join('')}</select><button data-action="add">添加角色</button></div>${app==='attendance'&&hadDeny?'<details><summary>个人拒绝与恢复默认</summary><label><input type="checkbox" id="clear-deny"> 明确撤销示例个人拒绝并恢复部门默认（可能增加权限）</label></details>':''}<details><summary>暂停此应用</summary><label><input type="checkbox" id="pause" ${draftPaused?'checked':''}> 暂停此员工使用该应用</label><p class="muted">保留各条授予；解除暂停后仍核对其他限制和有效期。</p></details>`;}
function preview(){if(mode==='department'){const value=document.querySelector('input[name=default]:checked').value;$('editor').dataset.proposed=value;$('editor').innerHTML=`<h3>保存后的部门默认（仅演示）</h3><p>${value==='grant'?'每位成员仅查看本人的考勤。':value==='none'?'本部门不再自动授予；独立合法角色仍按自身范围生效。':'本部门明确禁止；与没有默认授予分别记录。'}</p><p>影响 2 位合成成员；保留个人来源、暂停、禁止及期限。</p><p class="note warn">当前历史 deny 不在此迁移。需要 Owner 确认兼容方案后才能实施。</p>`}else{draftPaused=$('pause').checked;clearDeny=!!$('clear-deny')?.checked;const list=draft.filter(g=>roleKeys().includes(g.role));$('editor').innerHTML=`<h3>员工甲保存后的结果（仅演示）</h3><p>${draftPaused?'暂停该应用的全部已接入入口/API。':'解除总暂停，逐条核对有效角色、范围和期限。'}</p>${list.map(g=>`<p><strong>${templates[g.role].name}</strong>：仅 ${esc(g.scope)}${g.until?`，有效至 ${esc(g.until)}`:''}。</p>`).join('')}${app==='attendance'?`<p>${defaultSummary()}</p>`:''}${clearDeny?'<p class="note warn">你明确选择撤销个人拒绝，恢复部门默认可能增加本人考勤访问。</p>':'<p class="note">已有显式禁止、应用暂停、资格与职责分离仍优先执行；新模板版本不自动追加动作。</p>'}<p class="muted">角色与范围不会交叉组合。保存不会发送请求。</p>`}$('next').textContent='确认保存到演示';$('next').dataset.action='save';}
function close(){ $('overlay').classList.add('hidden');returnFocus?.focus() }
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;tab=page==='department'?'defaults':'users';render();return}if(b.dataset.tab){if(['profile','account'].includes(b.dataset.tab)){toast('本轮仅设计应用权限局部；其他页保留现有产品。');return}tab=b.dataset.tab;render();return}if(b.dataset.remove){draft=draft.filter(g=>g.key!==b.dataset.remove);drawEditor();return}if(b.dataset.roleDetail){const r=templates[b.dataset.roleDetail];toast(`${r.id}@${r.version}：${r.functions}；${r.state}。完整映射见同目录设计文档。`);return}switch(b.dataset.action){case 'edit':openEditor('person');break;case 'department-edit':openEditor('department');break;case 'close':close();break;case 'preview':preview();break;case 'save':if(mode==='department')defaultMode=$('editor').dataset.proposed;else{saved=structuredClone(draft);paused=draftPaused;pauseStates[app]=paused;if(clearDeny)hadDeny=false}close();render();document.querySelector('[data-action="'+(mode==='department'?'department-edit':'edit')+'"]')?.focus();toast('已保存到演示内存；真实 Site 权限没有变化。');break;case 'add':{const role=$('new-role').value,r=templates[role];draft.push({key:crypto.randomUUID(),role,scope:r.scopes[0]==='SELF'?'本人':r.scopes[0]==='DEPARTMENT'?'验收部门 A':r.scopes[0]==='COMPANY'?'验收公司甲':'检验组 A',until:''});drawEditor();break}case 'department-link':page='department';tab='defaults';render();break;case 'person-link':page='person';render();break;case 'pair-check':$('pair-result').textContent=paused?'不能：此应用模拟已暂停。':saved.some(g=>g.role==='reviewer'&&g.scope==='检验组 B')?'设计中存在 B 组复核授予；仍需核对期限、资格与职责分离。候选尚未接入。':'不能：当前复核员授予不包含检验组 B。B 组的检验员授予不产生复核权。';break;case 'deny-example':hadDeny=true;render();toast('已载入个人拒绝示例；恢复默认须明确核对增加权限。');break;case 'reset':saved=[{key:'example-clerk',role:'clerk',scope:'验收部门 A',until:'2026-12-31'}];paused=false;pauseStates={attendance:false,lims:false};hadDeny=false;defaultMode='grant';limsSeeded=false;app='attendance';render();toast('演示已重置。');break}});
document.addEventListener('change',event=>{const e=event.target;if(e.id==='app-select'){app=e.value;paused=pauseStates[app];if(app==='lims'&&!limsSeeded){limsSeeded=true;saved.push({key:'lims-a',role:'reviewer',scope:'检验组 A',until:''},{key:'lims-b',role:'tester',scope:'检验组 B',until:''})}render()}if(e.dataset.scope){const g=draft.find(g=>g.key===e.dataset.scope);if(g)g.scope=e.value}if(e.dataset.until){const g=draft.find(g=>g.key===e.dataset.until);if(g)g.until=e.value}});
document.addEventListener('keydown',event=>{if($('overlay').classList.contains('hidden'))return;if(event.key==='Escape'){close();return}if(event.key==='Tab'){const items=[...$('overlay').querySelectorAll('button,input,select')].filter(e=>!e.disabled);const first=items[0],last=items.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
render();
</script></body></html>
