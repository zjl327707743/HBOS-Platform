name: HBOS Inventory Integration Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - integration/hbos-platform-v1
      - feature/hbos-portal-product
    paths:
      - "apps/hb_inventory_app/**"
      - "services/hbos_ocr/**"
      - "scripts/ci/docker-compose.inventory-smoke.yml"
      - "scripts/ci/inventory_clean_site_smoke.sh"
      - ".github/workflows/inventory-integration-gate.yml"

permissions:
  contents: read

jobs:
  clean-site:
    # Run for every matching PR in the declared target branches and for manual dispatch.
    # The previous PR8-only head_ref guard caused Portal product PRs to be skipped.
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare HRMS mount expected by current compose
        run: |
          mkdir -p runtime/apps
          git clone --depth 1 --branch version-16 https://github.com/frappe/hrms.git runtime/apps/hrms

      - name: Inventory and OCR unit tests
        run: |
          export PYTHONPATH="$PWD/apps/hb_inventory_app:$PWD:$PYTHONPATH"
          python -m unittest discover -s apps/hb_inventory_app/tests -v
          python services/hbos_ocr/tests/test_validate.py
          python services/hbos_ocr/tests/test_c2_extract.py

      - name: Shell syntax
        run: |
          bash -n scripts/ci/inventory_clean_site_smoke.sh
          python - <<'PY'
          import yaml
          yaml.safe_load(open("scripts/ci/docker-compose.inventory-smoke.yml"))
          print("inventory smoke compose: OK")
          PY

      - name: Clean-site install + migrate smoke
        env:
          HBOS_SMOKE_PROJECT: hbos-inventory-${{ github.run_id }}
        run: bash scripts/ci/inventory_clean_site_smoke.sh
