name: HBOS Platform Integration Gate

on:
  push:
    branches:
      - integration/hbos-platform-v1
  pull_request:
    branches:
      - main
      - feature/hbos-portal-product
    paths:
      - "apps/hb_attendance_app/**"
      - "apps/hb_inventory_app/**"
      - "apps/hb_lims_app/**"
      - "apps/hbos_portal/**"
      - "services/hbos_ocr/**"
      - "frontend/hbos-lims-web/**"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/setup_fonts.sh"
      - "scripts/ci/platform_clean_site_smoke.sh"
      - ".github/workflows/platform-integration-gate.yml"

permissions:
  contents: read

jobs:
  platform-clean-site:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the reviewed same-site Portal bundle
        run: |
          bash scripts/release/build_bundle.sh
          tar -xzf .release/hbos-portal-release.tar.gz ./apps/hbos_portal/hbos_portal/public/portal

      - name: Prepare HRMS v16 source
        run: |
          mkdir -p runtime/apps
          git init runtime/apps/hrms
          git -C runtime/apps/hrms remote add origin https://github.com/frappe/hrms.git
          git -C runtime/apps/hrms fetch --depth 1 origin c0a04b80eeb721417b75cea758e831464d0da041
          git -C runtime/apps/hrms checkout --detach FETCH_HEAD

      - name: Validate shell
        run: |
          bash -n scripts/setup_fonts.sh
          bash -n scripts/prepare_hbos_web.sh
          bash -n scripts/ci/platform_clean_site_smoke.sh

      - name: Three-app clean-site integration
        env:
          HBOS_SMOKE_PROJECT: hbos-platform-${{ github.run_id }}
        run: bash scripts/ci/platform_clean_site_smoke.sh

  lims-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/hbos-lims-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/hbos-lims-web/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build:prod
      - name: Verify production artifact
        run: test -f dist/index.html
