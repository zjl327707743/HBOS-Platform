name: HBOS Quality Gate

on:
  pull_request:
    branches:
      - main
      - integration/hbos-platform-v1

permissions:
  contents: read

jobs:
  quality-gate:
    name: 质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 固化 PR 变更文件清单
        run: |
          set -e
          git rev-parse --verify origin/main
          git diff --name-only origin/main...HEAD > /tmp/hbos_changed_files
          test -s /tmp/hbos_changed_files || echo "本 PR 没有文件差异"

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 禁止真实 .env
        run: |
          if grep -qE '(^|/)\.env$' /tmp/hbos_changed_files; then
            echo "::error:: 禁止提交 .env 文件（.env.example 允许）"
            exit 1
          fi

      - name: 禁止数据库 dump 和备份
        run: |
          if grep -qE '\.sql(\.gz)?$' /tmp/hbos_changed_files; then
            echo "::error:: 禁止提交数据库 dump 或备份文件"
            exit 1
          fi

      - name: 禁止 Excel 和真实数据 CSV
        run: |
          if grep -qiE '\.(xlsx|xls|csv)$' /tmp/hbos_changed_files; then
            echo "::error:: 禁止提交 Excel 或 CSV 文件（可能含真实数据）"
            grep -iE '\.(xlsx|xls|csv)$' /tmp/hbos_changed_files || true
            exit 1
          fi

      - name: 禁止私钥和证书
        run: |
          if grep -qiE '\.(pem|key|crt|cer|p12|pfx)$' /tmp/hbos_changed_files; then
            echo "::error:: 禁止提交私钥或证书文件"
            exit 1
          fi

      - name: 禁止日志和 Site 配置
        run: |
          if grep -qiE '(\.log$|site_config\.json|sites/.*/site_config\.json)' /tmp/hbos_changed_files; then
            echo "::error:: 禁止提交日志或 Site 配置"
            exit 1
          fi

      - name: Python 语法编译
        run: |
          python -m compileall -q apps/ services/hbos_ocr/app

      - name: 运行 Attendance 基线回归
        run: |
          pip install -q openpyxl
          export PYTHONPATH="$PWD/apps/hb_attendance_app:$PYTHONPATH"
          python -m unittest discover -s apps/hb_attendance_app/tests -v

      - name: 运行 Inventory 治理与契约测试
        run: |
          python -m unittest discover -s apps/hb_inventory_app/tests -v

      - name: 运行 OCR 单元测试
        run: |
          python services/hbos_ocr/tests/test_validate.py
          python services/hbos_ocr/tests/test_c2_extract.py

      - name: 中文字体可重建性
        run: |
          command -v fc-list >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq fontconfig
          }
          bash -n scripts/setup_fonts.sh
          scripts/setup_fonts.sh --install

      - name: 工作流 YAML 语法
        run: |
          pip install -q pyyaml
          for f in .github/workflows/*.yml; do
            python -c "import yaml; yaml.safe_load(open('$f')); print('$f: OK')"
          done

      - name: 关键文档存在
        run: |
          for f in README.md CLAUDE.md AGENTS.md CONTRIBUTING.md; do
            test -f "$f" || { echo "::error:: 缺少关键文件: $f"; exit 1; }
          done

      - name: 治理脚本语法
        run: |
          for f in scripts/ci/*.sh scripts/setup_fonts.sh; do
            [ -f "$f" ] && bash -n "$f"
          done

      - name: 质量门禁通过
        run: echo "HBOS Quality Gate PASS"
