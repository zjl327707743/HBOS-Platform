name: HBOS Quality Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    name: 质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 固化 PR 变更文件清单
        run: |
          set -euo pipefail
          git rev-parse --verify origin/main
          git diff --name-only origin/main...HEAD > /tmp/hbos_changed_files
          echo "Changed files:"
          cat /tmp/hbos_changed_files

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 禁止 .env 文件
        run: |
          if grep -qE '(^|/)\.env$' /tmp/hbos_changed_files; then
            echo "::error:: 禁止提交 .env 文件（含敏感配置）"
            exit 1
          fi

      - name: 禁止数据库 dump 和备份文件
        run: |
          if grep -qE '\.sql(\.gz)?$' /tmp/hbos_changed_files; then
            echo "::error:: 禁止提交数据库 dump 或备份文件"
            exit 1
          fi

      - name: 禁止 Excel 和真实数据 CSV
        run: |
          grep -Ev '^(apps/hb_attendance_app/hb_attendance_app/translations/zh\.csv|apps/hb_lims_app/hb_lims_app/translations/zh\.csv)$' \
            /tmp/hbos_changed_files > /tmp/hbos_changed_files_without_translation || true
          if grep -qiE '\.(xlsx|xls|csv)$' /tmp/hbos_changed_files_without_translation; then
            echo "::error:: 禁止提交 Excel 或真实数据 CSV 文件"
            grep -iE '\.(xlsx|xls|csv)$' /tmp/hbos_changed_files_without_translation || true
            exit 1
          fi

      - name: 禁止私钥和证书
        run: |
          if grep -qiE '\.(pem|key|crt|cer|p12|pfx)$' /tmp/hbos_changed_files; then
            echo "::error:: 禁止提交私钥或证书文件"
            exit 1
          fi

      - name: 禁止日志和 Site 配置
        run: |
          if grep -qiE '(\.log$|site_config\.json|sites/.*/site_config\.json)' /tmp/hbos_changed_files; then
            echo "::error:: 禁止提交日志或 Site 配置文件"
            exit 1
          fi

      - name: Python 语法编译检查
        run: |
          python -m compileall -q apps/

      - name: 运行 hb_attendance_app 回归测试
        run: |
          pip install -q openpyxl
          export PYTHONPATH="$PWD/apps/hb_attendance_app:$PYTHONPATH"
          python -m unittest discover -s apps/hb_attendance_app/tests -v

      - name: 运行 hb_lims_app 契约测试
        run: |
          pip install -q pytest
          export PYTHONPATH="$PWD/apps/hb_lims_app:$PYTHONPATH"
          python -m pytest -q -p no:cacheprovider apps/hb_lims_app/tests

      - name: 检查 CI 工作流 YAML 语法
        run: |
          pip install -q pyyaml
          for f in .github/workflows/*.yml; do
            python -c "import yaml; yaml.safe_load(open('$f')); print('$f: OK')"
          done

      - name: 关键 Markdown 文件存在性检查
        run: |
          for f in README.md CLAUDE.md AGENTS.md CONTRIBUTING.md; do
            test -f "$f" || {
              echo "::error:: 缺少关键文件: $f"
              exit 1
            }
          done

      - name: 治理脚本语法检查
        run: |
          if [ -f scripts/ci/verify_repo_policy.sh ]; then
            bash -n scripts/ci/verify_repo_policy.sh
          fi

      - name: 质量门禁通过
        run: echo "HBOS Quality Gate PASS"
