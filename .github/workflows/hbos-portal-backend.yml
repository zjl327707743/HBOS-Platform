name: HBOS Portal Backend Gate

on:
  push:
    branches:
      - feature/hbos-portal-product
    paths:
      - 'apps/hbos_portal/**'
      - 'apps/hb_lims_app/hb_lims_app/hooks.py'
      - 'apps/hb_lims_app/hb_lims_app/hbos_lims/portal/**'
      - 'apps/hb_lims_app/tests/test_portal_provider_contract.py'
      - 'apps/hb_attendance_app/hb_attendance_app/hooks.py'
      - 'apps/hb_attendance_app/hb_attendance_app/hbos_attendance/portal/**'
      - 'apps/hb_attendance_app/tests/test_portal_provider_contract.py'
      - 'apps/hb_inventory_app/hb_inventory_app/hooks.py'
      - 'apps/hb_inventory_app/hb_inventory_app/hbos_inventory/portal/**'
      - 'apps/hb_inventory_app/tests/test_portal_provider_contract.py'
      - 'scripts/portal/**'
      - '.github/workflows/hbos-portal-backend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/hbos_portal/**'
      - 'apps/hb_lims_app/hb_lims_app/hooks.py'
      - 'apps/hb_lims_app/hb_lims_app/hbos_lims/portal/**'
      - 'apps/hb_lims_app/tests/test_portal_provider_contract.py'
      - 'apps/hb_attendance_app/hb_attendance_app/hooks.py'
      - 'apps/hb_attendance_app/hb_attendance_app/hbos_attendance/portal/**'
      - 'apps/hb_attendance_app/tests/test_portal_provider_contract.py'
      - 'apps/hb_inventory_app/hb_inventory_app/hooks.py'
      - 'apps/hb_inventory_app/hb_inventory_app/hbos_inventory/portal/**'
      - 'apps/hb_inventory_app/tests/test_portal_provider_contract.py'
      - 'scripts/portal/**'
      - '.github/workflows/hbos-portal-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal-backend:
    name: Portal 后端骨架
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Python 语法编译
        run: |
          python -m compileall -q apps/hbos_portal
          python -m compileall -q apps/hb_lims_app/hb_lims_app/hbos_lims/portal
          python -m compileall -q apps/hb_attendance_app/hb_attendance_app/hbos_attendance/portal
          python -m compileall -q apps/hb_inventory_app/hb_inventory_app/hbos_inventory/portal

      - name: 校验 Portal 本地脚本语法
        run: |
          bash -n scripts/portal/p2_2_runtime_smoke.sh
          bash -n scripts/portal/p3_workspace_runtime_smoke.sh
          bash -n scripts/portal/start_local_workspace.sh
          bash -n scripts/portal/start_isolated_preview.sh
          bash -n scripts/portal/stop_isolated_preview.sh

      - name: 隔离 Preview 不得扫描全局 backend
        run: |
          grep -q 'scripts/setup_fonts.sh --no-container-check' scripts/portal/start_isolated_preview.sh
          if grep -nE 'docker[[:space:]]+exec[[:space:]]+' scripts/portal/start_isolated_preview.sh; then
            echo "::error:: isolated preview 不得直接 docker exec 未命名空间容器"
            exit 1
          fi

      - name: 运行首个 LIMS Provider Contract
        run: |
          export PYTHONPATH="$PWD/apps/hb_lims_app:$PYTHONPATH"
          python -m unittest discover \
            -s apps/hb_lims_app/tests \
            -p 'test_portal_provider_contract.py' \
            -v

      - name: 运行 Attendance Provider Contract
        run: |
          export PYTHONPATH="$PWD/apps/hb_attendance_app:$PYTHONPATH"
          python -m unittest discover \
            -s apps/hb_attendance_app/tests \
            -p 'test_portal_provider_contract.py' \
            -v

      - name: 运行 Inventory Provider Contract
        run: |
          export PYTHONPATH="$PWD/apps/hb_inventory_app:$PYTHONPATH"
          python -m unittest discover \
            -s apps/hb_inventory_app/tests \
            -p 'test_portal_provider_contract.py' \
            -v

      - name: 运行 Portal Contract / Registry 单元测试
        working-directory: apps/hbos_portal
        run: |
          export PYTHONPATH="$PWD:$PYTHONPATH"
          python -m unittest discover -s tests -t . -v

      - name: 禁止 Portal 静态依赖业务 App
        run: |
          set -euo pipefail
          if grep -R -nE '^[[:space:]]*(from|import)[[:space:]]+(hb_attendance_app|hb_inventory_app|hb_lims_app)' \
            apps/hbos_portal/hbos_portal --include='*.py'; then
            echo "::error:: hbos_portal 不得静态 import Attendance / Inventory / LIMS"
            exit 1
          fi

      - name: 禁止 Guest Portal API
        run: |
          set -euo pipefail
          if grep -R -nE 'allow_guest[[:space:]]*=[[:space:]]*True' \
            apps/hbos_portal/hbos_portal/api --include='*.py'; then
            echo "::error:: Portal API 不得 allow_guest=True"
            exit 1
          fi

      - name: P2 禁止创建 DocType
        run: |
          set -euo pipefail
          if find apps/hbos_portal -type f -path '*/doctype/*/*.json' | grep -q .; then
            echo "::error:: P2 hbos_portal skeleton 不允许创建 DocType"
            find apps/hbos_portal -type f -path '*/doctype/*/*.json'
            exit 1
          fi

      - name: Portal Backend Gate 通过
        run: echo "HBOS Portal backend skeleton gate PASS"
