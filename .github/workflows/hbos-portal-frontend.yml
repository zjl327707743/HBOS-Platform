name: HBOS Portal Frontend Gate

on:
  push:
    branches:
      - feature/hbos-portal-product
      - m2-r10
    paths:
      - 'frontend/hbos-portal-web/**'
      - '.github/workflows/hbos-portal-frontend.yml'
      - 'scripts/portal/**'
  pull_request:
    branches:
      - main
      - feature/hbos-portal-product
    paths:
      - 'frontend/hbos-portal-web/**'
      - '.github/workflows/hbos-portal-frontend.yml'
      - 'scripts/portal/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal-build:
    name: Portal 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_PORTAL_DATA_MODE: frappe

    defaults:
      run:
        working-directory: frontend/hbos-portal-web

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/hbos-portal-web/package-lock.json

      - name: 显示 Node / npm 版本
        run: |
          node --version
          npm --version

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: 前端单元与组件回归
        run: npm run test:unit

      - name: 账号与会话回归
        run: npm test

      - name: 前端契约及 Mock 内容门控
        run: |
          npm run test:contract
          npm run test:mock-gate

      - name: LIMS Shell 契约
        run: bash ../../scripts/portal/lims_shell_contract.sh

      - name: Vue / TypeScript / Vite 构建
        run: npm run build

      - name: 验证构建产物
        run: |
          test -f dist/index.html
          echo "HBOS Portal frontend build: PASS"
