# Isolated Preview overlay.  Use the base Compose volumes without nested
# sites/assets mounts.  The Frappe v16 entrypoint runs
#   rm -rf sites/assets && ln -s ../../assets sites/assets
# Mounting sites/assets separately causes EBUSY and crashes the containers.
#
# The base docker-compose.yml already mounts the project-scoped "sites" volume
# on every Frappe service, and named "assets-data" on bench/assets where needed.
# The launcher always passes a dedicated -p project name and validates the
# resolved volume sources with preview_compose_guard.py before starting Docker.
#
# Keep this file as an explicit isolated-preview overlay/extension point.
services: {}
