services:
  backend:
    volumes:
      - ./apps/hb_inventory_app:/home/frappe/frappe-bench/apps/hb_inventory_app
      - ./apps/hb_lims_app:/home/frappe/frappe-bench/apps/hb_lims_app
    environment:
      PYTHONPATH: "/home/frappe/frappe-bench/apps/hrms:/home/frappe/frappe-bench/apps/hb_attendance_app:/home/frappe/frappe-bench/apps/hb_inventory_app:/home/frappe/frappe-bench/apps/hb_lims_app"

  configurator:
    volumes:
      - ./apps/hb_inventory_app:/home/frappe/frappe-bench/apps/hb_inventory_app
      - ./apps/hb_lims_app:/home/frappe/frappe-bench/apps/hb_lims_app
    environment:
      PYTHONPATH: "/home/frappe/frappe-bench/apps/hrms:/home/frappe/frappe-bench/apps/hb_attendance_app:/home/frappe/frappe-bench/apps/hb_inventory_app:/home/frappe/frappe-bench/apps/hb_lims_app"

  create-site:
    volumes:
      - ./apps/hb_inventory_app:/home/frappe/frappe-bench/apps/hb_inventory_app
      - ./apps/hb_lims_app:/home/frappe/frappe-bench/apps/hb_lims_app
    environment:
      PYTHONPATH: "/home/frappe/frappe-bench/apps/hrms:/home/frappe/frappe-bench/apps/hb_attendance_app:/home/frappe/frappe-bench/apps/hb_inventory_app:/home/frappe/frappe-bench/apps/hb_lims_app"
    command:
      - >
        wait-for-it -t 120 $$DB_HOST:$$DB_PORT;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for common_site_config.json";
          sleep 5;
          if (( `date +%s`-start > 120 )); then exit 1; fi;
        done;
        bench new-site $SITE_NAME --mariadb-user-host-login-scope='%' --admin-password=$ADMIN_PASSWORD --db-root-username=root --db-root-password=$DB_ROOT_PASSWORD --install-app erpnext --set-default;
        bench --site $$SITE_NAME install-app hrms;
        bench --site $$SITE_NAME install-app hb_attendance_app;
        bench --site $$SITE_NAME install-app hb_inventory_app;
        bench --site $$SITE_NAME install-app hb_lims_app;
        bench --site $$SITE_NAME migrate;
        bench --site $$SITE_NAME list-apps;
