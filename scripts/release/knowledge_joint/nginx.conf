pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  resolver 127.0.0.11 ipv6=off valid=10s;
  server {
    listen 8080;
    client_max_body_size 21m;
    location /assets/hbos_portal/portal/ { alias /var/www/hbos/portal/; }
    location /assets/ { alias /home/frappe/frappe-bench/sites/assets/; }
    location /mcp {
      set $knowledge_upstream http://service:8080;
      proxy_pass $knowledge_upstream/mcp;
      proxy_set_header Host $http_host;
      proxy_set_header Authorization $http_authorization;
      proxy_buffering off;
      proxy_read_timeout 90s;
    }
    location / {
      proxy_pass http://bff:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Frappe-Site-Name $http_x_frappe_site_name;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 95s;
    }
  }
}
