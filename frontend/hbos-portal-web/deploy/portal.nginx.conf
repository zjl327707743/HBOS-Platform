# HBOS 门户容器（生产形态）——与 Frappe 同源。
#
# 浏览器只看到本容器这一个来源：
#   /hbos/*  由本容器直接服务门户构建产物（VITE_BASE=/hbos/ 的产物，引用均为 /hbos/assets/...）
#   其余路径 全部反代到生产栈 frontend:8080
#
# 同源是 iframe 的前提：Frappe 发 X-Frame-Options: SAMEORIGIN，
# 门户内容区若以跨源地址承载其页面，浏览器会直接拦截。
#
# 本容器不挂载 sites 卷、不挂载任何 Frappe App 目录，也不运行 frappe 镜像的
# entrypoint（该 entrypoint 会 rm -rf 并重建 sites/assets，对本用途是多余且有害的写入）。

upstream frappe_frontend {
    server frontend:8080 fail_timeout=0;
}

map $http_x_forwarded_proto $portal_x_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 8080;
    server_name _;

    # 门户 SPA 使用 history 模式，/hbos 与 /hbos/ 都应进入 SPA
    location = /hbos {
        return 301 /hbos/;
    }

    # 门户构建产物。dist 挂在 /usr/share/nginx/html/hbos，
    # 故用 root 而非 alias：$uri 已含 /hbos 前缀，root 下自然命中。
    location /hbos/ {
        root /usr/share/nginx/html;
        # 末位回退到 index.html：SPA 的客户端路由（如 /hbos/embed）由前端自行处理
        try_files $uri $uri/ /hbos/index.html;
    }

    # Frappe 拥有的路径前缀，反代到生产栈，使浏览器只看到 8081 单一来源
    location ~ ^/(api|app|desk|assets|files|private|login|logout|method|printview|favicon\.ico)(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $portal_x_forwarded_proto;
        proxy_set_header X-Frappe-Site-Name frontend;
        proxy_read_timeout 120;
        proxy_pass http://frappe_frontend;
    }

    # socket.io 必须转发 WebSocket 升级；不设 Upgrade/Connection 则只通长轮询
    location /socket.io {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $portal_x_forwarded_proto;
        proxy_set_header X-Frappe-Site-Name frontend;
        proxy_pass http://frappe_frontend;
    }

    # 兜底：其余路径与 Frappe 在 8080 上的行为一致
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $portal_x_forwarded_proto;
        proxy_set_header X-Frappe-Site-Name frontend;
        proxy_read_timeout 120;
        proxy_pass http://frappe_frontend;
    }

    # 门户产物的 JS 体积较大（约 1.7MB），gzip 对首屏有意义
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 50m;
    absolute_redirect off;
}
