[project]
name = "hbos_portal"
authors = [
    { name = "HBOS", email = "admin@example.com" },
]
description = "HBOS workspace and portal platform shell"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = ["pypinyin==0.55.0"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
